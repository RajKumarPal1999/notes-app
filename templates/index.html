
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f6f8;
        }

        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        form, .note {
            background: white;
            padding: 18px;
            margin: 16px 0;
            border-radius: 8px;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        .server {
            color: #555;
        }

        .note p {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>My Notes App</h1>

    <p class="server">
        Served by EC2 server: <strong>{{ server_name }}</strong>
    </p>

    <form method="POST" action="/">
        <h2>Add a Note</h2>

        <label for="title">Title</label>
        <input id="title" name="title" type="text" required>

        <label for="content">Content</label>
        <textarea id="content" name="content" rows="4" required></textarea>

        <button type="submit">Save Note</button>
    </form>

    <h2>Saved Notes</h2>

    {% for note in notes %}
        <div class="note">
            <h3>{{ note['title'] }}</h3>
            <p>{{ note['content'] }}</p>
            <small>Created: {{ note['created_at'] }}</small>

            <form method="POST"
                  action="{{ url_for('delete_note', note_id=note['id']) }}">
                <button type="submit">Delete</button>
            </form>
        </div>
    {% else %}
        <p>No notes yet. Add your first note above.</p>
    {% endfor %}

    <p><a href="/health">Check application health</a></p>
</body>
</html>
